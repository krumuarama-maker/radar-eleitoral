[project]
name = "radar-fiscalizacao-municipal"
version = "0.1.0"
description = "Radar de fiscalização municipal contínua — coleta, preserva, verifica e prepara apontamentos para revisão humana"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "pdfplumber>=0.11",      # texto com coordenadas e página — essencial p/ âncora
    "pymupdf>=1.24",         # rápido, e lida com PDF malformado de portal municipal
    "selectolax>=0.3",       # parser HTML rápido
    "rapidfuzz>=3.9",        # casamento de nomes de objeto/empresa
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16.0", "pytesseract>=0.3.10", "pillow>=10.3"]
painel = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "respx>=0.21"]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["radar"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "fitz.*", "selectolax.*", "ocrmypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "rede: exige acesso à internet (não roda na CI padrão)",
    "fixture_real: usa documento público real preservado em tests/fixtures",
]
