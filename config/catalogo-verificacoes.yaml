# ============================================================================
# CATÁLOGO DE VERIFICAÇÕES — o núcleo de valor do radar
#
# Cada entrada é uma trilha de auditoria com origem declarada. Isso importa mais
# do que parece: um apontamento lastreado em metodologia publicada por órgão de
# controle (TCU, CGU, Banco Mundial, Open Contracting) é muito mais difícil de
# descartar como implicância pessoal do que uma regra que alguém inventou.
#
# TIPO:
#   D   determinístico puro — só dado estruturado (PNCP, SIM-AM). Calculável.
#   D+  determinístico, mas exige base externa (QSA/CNPJ, CEIS, SINAPI, RAIS)
#   H   híbrido — gatilho determinístico + confirmação por leitura de documento
#   IA  exige interpretação de documento
#
# STATUS:
#   implementada | planejada | bloqueada
#
# LEIA ANTES DE IMPLEMENTAR:
# Onde a fonte está marcada [resumo], ela veio de sumário de busca e NÃO do
# documento primário. Antes de codificar, abra a fonte. Regra construída sobre
# citação de segunda mão produz achado que cai na primeira resposta.
# ============================================================================

metodologia:
  limiares: >-
    Prefira fences de Tukey (Q1 - 1.5*IQR e Q3 + 1.5*IQR) calculados sobre a
    distribuição real dos próprios dados, em vez de limiar fixo arbitrário. É o
    que a biblioteca Cardinal (Open Contracting Partnership) faz, e é o que
    impede o radar de virar máquina de falso positivo: o que é "anormal" numa
    prefeitura de 12 mil habitantes não é o mesmo que numa capital.
  fontes_primarias:
    - nome: OCP Cardinal — indicadores implementados sobre padrão OCDS
      url: https://github.com/open-contracting/cardinal-rs
      licenca: MIT
    - nome: "Red flags in public procurement: a guide to using data (OCP, 73 indicadores)"
      url: https://www.open-contracting.org/wp-content/uploads/2024/12/OCP2024-RedFlagProcurement-1.pdf
      nota: LEITURA PRIORITÁRIA — não foi lido ainda
    - nome: skills-licitacoes (andrecorumba) — catálogo em português de red flags de edital
      url: https://github.com/andrecorumba/skills-licitacoes
      ressalva: >-
        Sem licença declarada. Tecnicamente não há permissão de reuso. Abrir
        issue pedindo MIT/CC-BY antes de incorporar texto literal. As ideias
        podem ser validadas de forma independente contra manuais da CGU/TCU.
    - nome: TCU — jogos de planilha em obras públicas
      url: https://portal.tcu.gov.br/en_us/biblioteca-digital/medidas-para-evitar-o-superfaturamento-decorrente-dos-jogos-de-planilha-em-obras-publicas.htm

# ---------------------------------------------------------------------------
# ONDE ESTÁ O DIFERENCIAL DESTE PROJETO
# ---------------------------------------------------------------------------
estrategia:
  achado_do_levantamento: >-
    Os robôs oficiais (ALICE e VigIA no TCU, ODP na CGU) concentram-se na fase
    de EDITAL. Quase ninguém automatiza o que acontece DEPOIS da assinatura —
    aditivos, medições, pagamentos fora da ordem cronológica, jogo de planilha.
    É justamente aí que o dinheiro se perde, e é onde um radar municipal tem
    vantagem, porque o volume de processos é pequeno o bastante para acompanhar
    cada contrato até o último pagamento.
  ordem_recomendada:
    1: >-
      Tudo que é D puro sobre o PNCP. Sem base externa, sem IA. É o alicerce e
      entrega achado na primeira semana.
    2: >-
      Base CNPJ + quadro societário. Uma única integração destrava ~15 regras de
      conluio e empresa de fachada. Maior retorno marginal do projeto inteiro.
    3: >-
      Indicadores estatísticos com fences de Tukey.
    4: >-
      Metadados de PDF das propostas (CONL-13): trivial de implementar, quase
      ninguém faz, e pega conluio.
    5: >-
      Execução contratual — aditivos, medições, pagamentos. O espaço vazio.
    6: >-
      Por último as regras de IA sobre texto de edital. São as mais numerosas e
      as menos confiáveis; só fazem sentido sobre um alicerce que já funciona.

